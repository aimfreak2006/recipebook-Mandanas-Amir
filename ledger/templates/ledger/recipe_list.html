{% extends "ledger/base.html" %}

{% block body %}
    <h3> Recipe List </h3>
    <ul>
        {% for recipe in recipes %}
            <a href='{{ recipe.get_absolute_url }}'>{{recipe.name}}</a>
        {% endfor %}
    </ul>
    <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
{% endblock %}
