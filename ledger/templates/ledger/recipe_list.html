{% extends "ledger/base.html" %}

{% block body %}
    <h3> Recipe List </h3>
    <ul>
        {% for recipe in recipes %}
            <h2>{{ recipe.name }} by {{ recipe.author.name }}</h2>
            <a href='{{ recipe.get_absolute_url }}'>{{ recipe.name }}_detail</a>
        {% endfor %}
    </ul>
    {{ form }}
{% endblock %}
